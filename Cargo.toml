[package]
name = "network-guardian"
version = "0.3.0"
edition = "2021"
description = "Local-first workstation security monitor — protecting the builders"
license = "MIT"
repository = "https://github.com/AktI-Tech/network-guardian"
readme = "README.md"
keywords = ["security", "network", "monitoring", "wsl", "privacy"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
crossbeam = "0.8"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# Packet capture (optional)
pcap = { version = "1.1", optional = true }

# Storage
rusqlite = { version = "0.30", features = ["bundled"] }

# Notifications
notify-rust = "4.10"

# Host process ↔ socket map
netstat2 = "0.11"
sysinfo = "0.33"
dns-lookup = "2"

# Local HTTP API + dashboard (no CORS — same-origin only by design)
axum = "0.7"
serde_yaml = "0.9"
tokio-stream = { version = "0.1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_NetworkManagement_IpHelper", "Win32_Foundation", "Win32_System_Com"] }

[[bin]]
name = "network_guardian"
path = "src/main.rs"

[features]
default = []
# Enable packet capture (requires Npcap on Windows or libpcap-dev on Linux)
packet-capture = ["pcap"]
